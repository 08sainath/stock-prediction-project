name: Add All Stocks PDF download

on:
  push:
    paths:
      - .github/workflows/add-pdf-download.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add PDF export
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')

          if 'def make_all_stocks_pdf(' not in text:
              marker = 'def all_stocks_page():'
              helper = '''def make_all_stocks_pdf(table):\n    """Create a landscape PDF containing the complete currently displayed stock table."""\n    from io import BytesIO\n    from reportlab.lib import colors\n    from reportlab.lib.pagesizes import A3, landscape\n    from reportlab.lib.styles import getSampleStyleSheet\n    from reportlab.lib.units import mm\n    from reportlab.platypus import SimpleDocTemplate, Table, TableStyle, Paragraph, Spacer\n\n    buf = BytesIO()\n    doc = SimpleDocTemplate(\n        buf, pagesize=landscape(A3), leftMargin=8*mm, rightMargin=8*mm,\n        topMargin=8*mm, bottomMargin=8*mm,\n    )\n    styles = getSampleStyleSheet()\n    title = Paragraph('<b>SMA — All Stocks</b>', styles['Title'])\n    data = [list(table.columns)]\n    for row in table.itertuples(index=False, name=None):\n        values = []\n        for value in row:\n            if pd.isna(value):\n                values.append('—')\n            elif isinstance(value, float):\n                values.append(f'{value:.2f}')\n            else:\n                values.append(str(value))\n        data.append(values)\n\n    usable_width = landscape(A3)[0] - 16*mm\n    col_widths = [usable_width / max(1, len(data[0]))] * len(data[0])\n    pdf_table = Table(data, repeatRows=1, colWidths=col_widths, splitByRow=1)\n    pdf_table.setStyle(TableStyle([\n        ('BACKGROUND', (0,0), (-1,0), colors.HexColor('#b88722')),\n        ('TEXTCOLOR', (0,0), (-1,0), colors.white),\n        ('FONTNAME', (0,0), (-1,0), 'Helvetica-Bold'),\n        ('FONTSIZE', (0,0), (-1,-1), 6),\n        ('LEADING', (0,0), (-1,-1), 7),\n        ('GRID', (0,0), (-1,-1), 0.25, colors.HexColor('#d8d8d8')),\n        ('VALIGN', (0,0), (-1,-1), 'MIDDLE'),\n        ('LEFTPADDING', (0,0), (-1,-1), 2),\n        ('RIGHTPADDING', (0,0), (-1,-1), 2),\n        ('TOPPADDING', (0,0), (-1,-1), 2),\n        ('BOTTOMPADDING', (0,0), (-1,-1), 2),\n    ]))\n    doc.build([title, Spacer(1, 4*mm), Paragraph(f'Complete table: {len(table):,} stocks', styles['Normal']), Spacer(1, 3*mm), pdf_table])\n    return buf.getvalue()\n\n\n'''
              if marker not in text:
                  raise SystemExit('all_stocks_page marker not found')
              text = text.replace(marker, helper + marker, 1)

          marker = '    st.dataframe(\n        table,'
          button = '''    st.download_button(\n        label="Download Full Table PDF",\n        data=make_all_stocks_pdf(table),\n        file_name="SMA_All_Stocks.pdf",\n        mime="application/pdf",\n        use_container_width=True,\n    )\n\n'''
          if 'label="Download Full Table PDF"' not in text:
              if marker not in text:
                  raise SystemExit('table marker not found')
              text = text.replace(marker, button + marker, 1)

          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Add reportlab dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('requirements.txt')
          text = p.read_text(encoding='utf-8')
          if 'reportlab' not in text.lower():
              text = text.rstrip() + '\nreportlab==4.4.4\n'
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py requirements.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Add full All Stocks PDF download'
          git push
