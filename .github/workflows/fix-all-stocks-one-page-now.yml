name: Fix All Stocks one page now

on:
  push:
    paths:
      - .github/workflows/fix-all-stocks-one-page-now.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove pagination from All Stocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')
          pattern = r'(?ms)^    page_size\s*=\s*60\s*\n.*?^    page_df\s*=\s*df\.iloc\[start_i:start_i \+ page_size\]\s*\n'
          replacement = '    # All Stocks: load the complete filtered universe in one scrollable table.\n    page_df = df\n'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('Pagination block not found')
          text = text.replace('Live OHLC data is loaded page-by-page to avoid rate limits.', 'Live OHLC data is loaded for the complete stock list.')
          text = text.replace('Showing {len(table):,} matching stocks on this page.', 'Showing all {len(table):,} matching stocks — scroll the table to browse.')
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Remove All Stocks pagination'
          git push
