name: Apply paper trading

on:
  push:
    paths:
      - 'scripts/paper_trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply paper trading integration
        run: python scripts/apply_paper_trading.py
      - name: Compile app
        run: python -m py_compile app.py modules/paper_trading.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py modules/paper_trading.py
          git commit -m 'Integrate paper trading' || exit 0
          git push
