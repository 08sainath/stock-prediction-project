name: Fix PDF to preserve table order

on:
  push:
    paths:
      - .github/workflows/fix-pdf-order.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update PDF export to preserve displayed order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')
          old = '''    for row in table.itertuples(index=False, name=None):\n        values = []\n'''
          new = '''    # Preserve the exact row and column order of the table after all filters/sorting.\n    export_table = table.copy().reset_index(drop=True)\n    for row in export_table.itertuples(index=False, name=None):\n        values = []\n'''
          if old not in text:
              raise SystemExit('PDF row loop not found')
          text = text.replace(old, new, 1)
          text = text.replace('data=make_all_stocks_pdf(table),', 'data=make_all_stocks_pdf(table),', 1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve All Stocks table order in PDF'
          git push
