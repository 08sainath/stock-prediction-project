name: Fix navigation

on:
  push:
    paths:
      - scripts/navigation_trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply navigation fix
        run: python scripts/fix_navigation.py
      - name: Validate
        run: python -m py_compile app.py modules/paper_trading.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fix navigation routing' || exit 0
          git push
