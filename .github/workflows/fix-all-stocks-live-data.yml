name: Fix All Stocks live data

on:
  push:
    paths:
      - .github/workflows/fix-all-stocks-live-data.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix snapshot call and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')
          old = 'executor.submit(stock_snapshot, row.symbol, row.exchange, row.code, row.company): row'
          new = 'executor.submit(stock_snapshot, yahoo_ticker(row.exchange, row.symbol, row.code)): row'
          if old not in text:
              raise SystemExit('Target snapshot call not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile app.py modules/paper_trading.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fix All Stocks live quote loading'
          git push
