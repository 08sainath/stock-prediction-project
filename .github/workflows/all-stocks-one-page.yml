name: All Stocks one page

on:
  push:
    paths:
      - .github/workflows/all-stocks-one-page.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove All Stocks pagination
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')
          old = '''    page_size = 60\n    total_pages = max(1, math.ceil(len(df) / page_size))\n    page = st.number_input("Page", min_value=1, max_value=total_pages, value=1, step=1, key="all_page")\n    start_i = (page - 1) * page_size\n    page_df = df.iloc[start_i:start_i + page_size]\n'''
          new = '''    # Show the complete filtered universe in one scrollable table; no pagination.\n    page_df = df\n'''
          if old not in text:
              raise SystemExit('Pagination block not found')
          text = text.replace(old, new, 1)
          text = text.replace('st.markdown(f'<div class="small-note">Showing {len(table):,} matching stocks on this page.</div>', unsafe_allow_html=True)', 'st.markdown(f'<div class="small-note">Showing all {len(table):,} matching stocks — scroll the table to browse.</div>', unsafe_allow_html=True)', 1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Show all stocks on one page'
          git push
