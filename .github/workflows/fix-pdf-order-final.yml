name: Fix PDF export order
on:
  push:
    paths:
      - '.github/workflows/fix-pdf-order-final.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch PDF export
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app.py')
          s = p.read_text()
          start = s.find('def make_all_stocks_pdf(')
          if start < 0:
              raise SystemExit('make_all_stocks_pdf not found')
          end = s.find('\ndef all_stocks_page(', start)
          if end < 0:
              raise SystemExit('all_stocks_page boundary not found')
          new = '''def make_all_stocks_pdf(table):
    # IMPORTANT: export exactly the DataFrame passed by the page.
    # This preserves the server-side filter + sort order shown in the app.
    from reportlab.lib import colors
    from reportlab.lib.pagesizes import A3, landscape
    from reportlab.lib.styles import getSampleStyleSheet
    from reportlab.platypus import SimpleDocTemplate, Table, TableStyle, Paragraph, Spacer
    from reportlab.lib.units import mm

    export_table = table.copy().reset_index(drop=True)
    buf = io.BytesIO()
    doc = SimpleDocTemplate(
        buf,
        pagesize=landscape(A3),
        leftMargin=8 * mm,
        rightMargin=8 * mm,
        topMargin=8 * mm,
        bottomMargin=8 * mm,
    )
    styles = getSampleStyleSheet()
    title = Paragraph('<b>SMA — All Stocks</b>', styles['Title'])
    data = [list(export_table.columns)]
    for row in export_table.itertuples(index=False, name=None):
        data.append([('' if v is None or pd.isna(v) else str(v)) for v in row])
    col_widths = [max(24 * mm, min(55 * mm, 170 * mm / max(1, len(export_table.columns))))] * len(export_table.columns)
    tbl = Table(data, repeatRows=1, colWidths=col_widths)
    tbl.setStyle(TableStyle([
        ('BACKGROUND', (0, 0), (-1, 0), colors.HexColor('#171717')),
        ('TEXTCOLOR', (0, 0), (-1, 0), colors.white),
        ('FONTNAME', (0, 0), (-1, 0), 'Helvetica-Bold'),
        ('FONTSIZE', (0, 0), (-1, -1), 6),
        ('LEADING', (0, 0), (-1, -1), 7),
        ('GRID', (0, 0), (-1, -1), 0.25, colors.HexColor('#dddddd')),
        ('VALIGN', (0, 0), (-1, -1), 'MIDDLE'),
        ('ROWBACKGROUNDS', (0, 1), (-1, -1), [colors.white, colors.HexColor('#f7f7f7')]),
        ('LEFTPADDING', (0, 0), (-1, -1), 3),
        ('RIGHTPADDING', (0, 0), (-1, -1), 3),
        ('TOPPADDING', (0, 0), (-1, -1), 2),
        ('BOTTOMPADDING', (0, 0), (-1, -1), 2),
    ]))
    doc.build([title, Spacer(1, 3 * mm), tbl])
    buf.seek(0)
    return buf.getvalue()
'''
          p.write_text(s[:start] + new + s[end:])
          PY
          python -m py_compile app.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Fix PDF export to preserve table order'
          git push
