name: Fix Paper Trading Mobile UI
on:
  push:
    paths:
      - '.github/workflows/fix-paper-ui.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile visibility and controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          marker = '/* Mobile responsive layout */'
          if marker not in s:
              raise SystemExit('Mobile CSS marker not found')
          css = '''
/* Paper Trading / Streamlit mobile visibility fixes */
[data-testid="stMetricValue"], [data-testid="stMetricValue"] * { color:#171717 !important; opacity:1 !important; }
[data-testid="stMetricLabel"], [data-testid="stMetricLabel"] * { color:#77736d !important; opacity:1 !important; }
[data-testid="stMetricDelta"], [data-testid="stMetricDelta"] * { opacity:1 !important; }
.stButton > button { color:#171717 !important; background:#ffffff !important; border:1px solid #e9e3da !important; }
.stButton > button[kind="primary"], .stButton > button[data-testid="baseButton-primary"] { color:#ffffff !important; background:#171717 !important; border-color:#171717 !important; }
.stTextInput input, .stNumberInput input, [data-baseweb="select"] { color:#171717 !important; background:#ffffff !important; }
.stTextInput input::placeholder { color:#77736d !important; opacity:1 !important; }
.bottom-nav label { color:#171717 !important; }
.bottom-nav label:has(input:checked) { color:#ffffff !important; background:#171717 !important; }
@media (max-width:430px) {
  .block-container { padding:12px 10px 100px !important; }
  [data-testid="stHorizontalBlock"] { gap:8px !important; }
  [data-testid="stHorizontalBlock"] > [data-testid="stColumn"] { min-width:100% !important; width:100% !important; flex:1 1 100% !important; }
  [data-testid="stMetricValue"] { font-size:20px !important; }
  .stButton > button { min-height:42px !important; }
}
'''
          if 'Paper Trading / Streamlit mobile visibility fixes' not in s:
              s = s.replace(marker, css + '\n' + marker, 1)
          p.write_text(s)
          PY
      - name: Fix All Stocks PDF export order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          start = s.find('def make_all_stocks_pdf(')
          end = s.find('\ndef all_stocks_page(', start)
          if start < 0 or end < 0:
              raise SystemExit('PDF helper boundary not found')
          new = '''def make_all_stocks_pdf(table):
    """Export the exact server-side table order; never re-sort rows for PDF."""
    from io import BytesIO
    from reportlab.lib import colors
    from reportlab.lib.pagesizes import A3, landscape
    from reportlab.lib.styles import getSampleStyleSheet
    from reportlab.lib.units import mm
    from reportlab.platypus import SimpleDocTemplate, Table, TableStyle, Paragraph, Spacer

    # Copy only; preserve every row in exactly the order supplied by all_stocks_page.
    export_table = table.copy().reset_index(drop=True)
    buf = BytesIO()
    doc = SimpleDocTemplate(
        buf, pagesize=landscape(A3), leftMargin=8*mm, rightMargin=8*mm,
        topMargin=8*mm, bottomMargin=8*mm,
    )
    styles = getSampleStyleSheet()
    title = Paragraph('<b>SMA — All Stocks</b>', styles['Title'])
    data = [list(export_table.columns)]
    for row in export_table.itertuples(index=False, name=None):
        values = []
        for value in row:
            if pd.isna(value):
                values.append('—')
            elif isinstance(value, float):
                values.append(f'{value:.2f}')
            else:
                values.append(str(value))
        data.append(values)

    usable_width = landscape(A3)[0] - 16*mm
    col_widths = [usable_width / max(1, len(data[0]))] * len(data[0])
    pdf_table = Table(data, repeatRows=1, colWidths=col_widths, splitByRow=1)
    pdf_table.setStyle(TableStyle([
        ('BACKGROUND', (0,0), (-1,0), colors.HexColor('#b88722')),
        ('TEXTCOLOR', (0,0), (-1,0), colors.white),
        ('FONTNAME', (0,0), (-1,0), 'Helvetica-Bold'),
        ('FONTSIZE', (0,0), (-1,-1), 6),
        ('LEADING', (0,0), (-1,-1), 7),
        ('GRID', (0,0), (-1,-1), 0.25, colors.HexColor('#d8d8d8')),
        ('VALIGN', (0,0), (-1,-1), 'MIDDLE'),
        ('LEFTPADDING', (0,0), (-1,-1), 2),
        ('RIGHTPADDING', (0,0), (-1,-1), 2),
        ('TOPPADDING', (0,0), (-1,-1), 2),
        ('BOTTOMPADDING', (0,0), (-1,-1), 2),
    ]))
    doc.build([title, Spacer(1, 4*mm), Paragraph(f'Complete table: {len(export_table):,} stocks', styles['Normal']), Spacer(1, 3*mm), pdf_table])
    return buf.getvalue()
'''
          p.write_text(s[:start] + new + s[end:])
          PY
      - name: Validate
        run: python -m py_compile app.py modules/paper_trading.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Fix All Stocks PDF export order'
          git push
