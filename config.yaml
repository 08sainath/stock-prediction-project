# ===============================
# MODEL SETTINGS
# ===============================

default_stock_symbol: "TCS"
prediction_horizon: 1
lookback_window: 60

models:
  random_forest:
    n_estimators: 200
    max_depth: null
    random_state: 42
  cnn_lstm:
    hidden_size: 64
    input_channels: 1
    epochs: 10
    learning_rate: 0.001
    batch_size: 32

# ===============================
# PATHS
# ===============================

data_paths:
  raw: "data/raw/"
  processed: "data/processed/"
  models: "models_saved/"
  logs: "logs/"

# ===============================
# REAL-TIME SETTINGS
# ===============================

realtime:
  update_interval_seconds: 30
  enabled_stocks:
    - "RELIANCE"
    - "TCS"
    - "INFY"
    - "NIFTY50"

# ===============================
# PREPROCESSING
# ===============================

preprocessing:
  missing_value_method: "forward_fill"
  normalization: "minmax"

# ===============================
# FEATURE ENGINEERING
# ===============================

feature_engineering:
  technical_indicators:
    - sma_20
    - ema_20
    - rsi
    - macd
    - bollinger_bands
  lag_features:
    - 1
    - 5
    - 20
  volatility_window: 20
